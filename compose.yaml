services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: perfumes
      POSTGRES_USER: perfumes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/002_offer_images.sql:/docker-entrypoint-initdb.d/002_offer_images.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfumes -d perfumes"]
      interval: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://perfumes:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/perfumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  ingest:
    build: .
    command: ["python", "-m", "app.ingest"]
    environment:
      DATABASE_URL: postgresql://perfumes:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/perfumes
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment:
      DATABASE_URL: postgresql://perfumes:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/perfumes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
